name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install -e ".[dev,evaluation]"
      - run: python scripts/generate_proto.py
      - run: python -m pytest -q

  java-control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - run: mvn --batch-mode test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.gemma.yaml config --quiet
        env:
          HF_TOKEN: ci-placeholder
